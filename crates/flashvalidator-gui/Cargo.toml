[package]
name = "flashvalidator-gui"
description = "FlashValidator desktop app: fast, data-preserving check for counterfeit and failing USB drives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "flashvalidator-gui"
path = "src/main.rs"

[dependencies]
flashvalidator-core.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
    "accesskit",
] }

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
