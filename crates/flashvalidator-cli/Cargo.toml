[package]
name = "flashvalidator-cli"
description = "FlashValidator command-line tool: fast, data-preserving check for counterfeit and failing USB drives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "flashvalidator"
path = "src/main.rs"

[dependencies]
flashvalidator-core.workspace = true
serde_json.workspace = true
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
