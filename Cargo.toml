[workspace]
resolver = "3"
members = ["crates/flashvalidator-core", "crates/flashvalidator-cli", "crates/flashvalidator-gui"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["FlashValidator contributors"]
keywords = ["usb", "flash", "counterfeit", "storage", "validation"]
categories = ["command-line-utilities", "filesystem", "hardware-support"]

[workspace.dependencies]
flashvalidator-core = { path = "crates/flashvalidator-core", version = "1.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
